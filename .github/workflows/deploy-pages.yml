name: Deploy GitHub Pages + Supabase Functions

on:
  push:
    branches:
      - github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITHUB_PAGES: "true"
  GITHUB_PAGES_REPO: "FitMe"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL }}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase functions deploy get-signup-enabled --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy auth-resolve-username --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy get-exercises --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy admin-toggle-signup --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy admin-create-client --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy admin-reset-password --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy admin-delete-client --project-ref "$SUPABASE_PROJECT_REF"

  build-and-deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
